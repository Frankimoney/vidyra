name: Build RunPod images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which RunPod image to build
        type: choice
        options:
          - both
          - studio
          - pipeline
        default: both
  push:
    branches: [main]
    paths:
      - deploy/runpod/pipeline-image-rev

permissions:
  contents: read
  packages: write

concurrency:
  group: build-runpod-images
  cancel-in-progress: false

jobs:
  pipeline:
    name: Build pipeline image
    if: ${{ github.event_name == 'push' || github.event.inputs.target != 'studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/pipeline.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/frankimoney/vidyra-pipeline:latest
            ghcr.io/frankimoney/vidyra-pipeline:${{ github.sha }}
          no-cache: true
          provenance: false
          sbom: false

  studio:
    name: Build studio image
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'pipeline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10000
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: /mnt/build
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Docker data root to build volume
        run: |
          sudo systemctl stop docker.socket || true
          sudo systemctl stop docker || true
          sudo mkdir -p /mnt/build/docker
          sudo cp -a /var/lib/docker/. /mnt/build/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/build/docker /var/lib/docker
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo python3 -c "import json; p='/etc/docker/daemon.json'; d=json.load(open(p)); d['dns']=['8.8.8.8','1.1.1.1']; json.dump(d, open(p,'w'))"
          else
            echo '{"dns":["8.8.8.8","1.1.1.1"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          sudo systemctl start docker || sudo service docker start
          sleep 5
          docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show available disk
        run: df -h

      - name: Build and push studio image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/frankimoney/vidyra-studio:latest
          no-cache: true
          provenance: false
          sbom: false
