name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Backend checks (no GPU)
        env:
          PYTHONIOENCODING: utf-8
          RUNPOD_FAKE: "1"
          APP_ENV: development
          DEV_API_KEY: vidyra-dev-key
          STORAGE_ROOT: storage/ci
        run: |
          python scripts/test_recipes.py
          python scripts/test_aspect.py
          python scripts/test_storyboard.py
          python scripts/test_security.py

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
